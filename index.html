<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barber House</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #222222;
        }

        /* ---------- Шапка ---------- */
        .header {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background-color: #000000;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #0d6efd;
        }

        .menu {
            display: flex;
            gap: 25px;
        }

        .menu a {
            position: relative;
            color: white;
            text-decoration: none;
            transition: color 0.3s;
        }

        .menu a::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -5px;
            width: 0;
            height: 2px;
            background-color: #0d6efd;
            transition: width 0.3s;
        }

        .menu a:hover {
            color: #6ea8fe;
        }

        .menu a:hover::after {
            width: 100%;
        }

        /* ---------- Главный экран ---------- */
        .hero {
            text-align: center;
            padding: 100px 20px;
            background: linear-gradient(180deg, #e8f1ff 0%, #ffffff 100%);
        }

        .hero h1 {
            font-size: 48px;
            margin: 0 0 15px 0;
            animation: fadeUp 0.8s ease backwards;
        }

        .hero p {
            font-size: 20px;
            margin: 0 0 30px 0;
            color: #555555;
            animation: fadeUp 0.8s ease 0.2s backwards;
        }

        .button {
            display: inline-block;
            background-color: #0d6efd;
            color: white;
            padding: 15px 30px;
            border-radius: 10px;
            text-decoration: none;
            box-shadow: 0 5px 15px rgba(13, 110, 253, 0.3);
            transition: transform 0.3s, box-shadow 0.3s;
            animation: fadeUp 0.8s ease 0.4s backwards;
        }

        .button:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(13, 110, 253, 0.5);
        }

        /* ---------- Услуги ---------- */
        .services {
            padding: 60px 40px;
            text-align: center;
        }

        .cards {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 30px;
        }

        .card {
            background-color: #0d6efd;
            color: white;
            border-radius: 10px;
            padding: 25px;
            width: 250px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(13, 110, 253, 0.4);
        }

        .card h3 {
            margin: 0 0 10px 0;
        }

        .card p {
            margin: 0;
            font-size: 22px;
            font-weight: bold;
        }

        /* ---------- Контакты ---------- */
        .contacts {
            padding: 60px 40px;
            text-align: center;
            background-color: #f5f5f5;
        }

        /* ---------- Анимации ---------- */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .reveal {
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 0.8s, transform 0.8s;
        }

        .reveal.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* ---------- Адаптивность ---------- */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 15px;
                padding: 15px 20px;
            }

            .hero {
                padding: 60px 20px;
            }

            .hero h1 {
                font-size: 32px;
            }

            .hero p {
                font-size: 18px;
            }

            .services,
            .contacts {
                padding: 40px 20px;
            }

            .cards {
                flex-direction: column;
                align-items: center;
            }

            .card {
                width: 100%;
                max-width: 320px;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">Barber House</div>
        <div class="menu">
            <a href="#services">Услуги</a>
            <a href="#contacts">Контакты</a>
        </div>
    </div>

    <div class="hero">
        <h1>Стрижка, которая вам идёт</h1>
        <p>Барбершоп в центре города. Запись онлайн.</p>
        <a href="#contacts" class="button">Записаться</a>
    </div>

    <div class="services" id="services">
        <h2 class="reveal">Услуги</h2>
        <div class="cards reveal">
            <div class="card">
                <h3>Стрижка</h3>
                <p>3 000 ₸</p>
            </div>
            <div class="card">
                <h3>Борода</h3>
                <p>2 000 ₸</p>
            </div>
            <div class="card">
                <h3>Стрижка + борода</h3>
                <p>4 500 ₸</p>
            </div>
        </div>
    </div>

    <div class="contacts" id="contacts">
        <h2 class="reveal">Контакты</h2>
        <p class="reveal">Адрес: ул. Примерная, 10</p>
        <p class="reveal">Телефон: +7 700 000 00 00</p>
        <p class="reveal">Работаем: ежедневно с 10:00 до 21:00</p>
    </div>

    <script>
        const elements = document.querySelectorAll('.reveal');

        const observer = new IntersectionObserver(function (entries) {
            entries.forEach(function (entry) {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                    observer.unobserve(entry.target);
                }
            });
        }, { threshold: 0.2 });

        elements.forEach(function (el) {
            observer.observe(el);
        });
    </script>

</body>
</html>
